openapi: 3.1.0
info:
  title: hono-cqrs-prac backend API
  version: 0.1.0
  description: hono-cqrs-prac のバックエンド API (users / auth)
tags:
  - name: Users
  - name: Auth
paths:
  /auth/login:
    post:
      operationId: login
      description: ログイン (メール・パスワードでトークンを発行する。認証不要)
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: リクエスト内容が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
        '401':
          description: 認証情報が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorException'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: logout
      description: ログアウト (要認証。リフレッシュトークンを失効させる)
      parameters: []
      responses:
        '204':
          description: 成功
        '401':
          description: 認証情報が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorException'
      tags:
        - Auth
      security:
        - BearerAuth: []
  /auth/refresh:
    post:
      operationId: refresh
      description: アクセストークンを再発行する (リフレッシュトークンを使用。認証不要)
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: リクエスト内容が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
        '401':
          description: 認証情報が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorException'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /users:
    post:
      operationId: createUser
      description: ユーザーを新規作成する (サインアップ想定のため認証不要)
      parameters: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          description: リクエスト内容が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorException'
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
  /users/{id}:
    get:
      operationId: getUser
      description: IDを指定してユーザーを取得する (要認証)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
        '401':
          description: 認証情報が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
        '404':
          description: リソースが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorException'
      tags:
        - Users
      security:
        - BearerAuth: []
    put:
      operationId: updateUser
      description: ユーザーを更新する (要認証)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '204':
          description: 成功
        '400':
          description: リクエスト内容が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
        '401':
          description: 認証情報が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
        '404':
          description: リソースが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorException'
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      security:
        - BearerAuth: []
    delete:
      operationId: deleteUser
      description: ユーザーを削除する (要認証)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '204':
          description: 成功
        '401':
          description: 認証情報が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
        '404':
          description: リソースが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorException'
      tags:
        - Users
      security:
        - BearerAuth: []
components:
  schemas:
    AccessToken:
      type: string
      minLength: 20
      maxLength: 2048
      pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
      format: password
      description: アクセストークン(JWT想定)。認可に使用する。
      title: AccessToken
      examples:
        - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyIiwiaWF0IjoxNzM1NzE4NDAwfQ.srCq5l7u2mKq8eM4X4g5wqVd5J9Jw7V0q1c2d3e4f5g
    BadRequestException:
      type: object
      required:
        - errorCode
        - message
        - meta
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
        meta:
          $ref: '#/components/schemas/CommonResponseMeta'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      description: リクエスト内容が不正
      title: BadRequestException
      examples:
        - errorCode: '4000'
          message: BadRequestException
          meta:
            respondedAt: '2025-01-01T12:00:00Z'
          details:
            - field: email
              message: メールアドレスの形式が不正です
    CommonResponseMeta:
      type: object
      required:
        - respondedAt
      properties:
        respondedAt:
          $ref: '#/components/schemas/RespondedAt'
      title: CommonResponseMeta
    CreateUserRequest:
      type: object
      required:
        - name
        - mailAddress
        - password
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        mailAddress:
          $ref: '#/components/schemas/MailAddress'
        password:
          $ref: '#/components/schemas/Password'
      title: CreateUserRequest
    CreateUserResponse:
      type: object
      required:
        - meta
      properties:
        meta:
          $ref: '#/components/schemas/CommonResponseMeta'
      title: CreateUserResponse
    ErrorCode:
      type: string
      description: エラーコード
      title: ErrorCode
      examples:
        - '4000'
    ErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
      description: バリデーションエラーの詳細
      title: ErrorDetail
    ErrorMessage:
      type: string
      description: エラーメッセージ
      title: ErrorMessage
      examples:
        - BadRequestException
    GetUserResponse:
      type: object
      required:
        - result
        - meta
      properties:
        result:
          $ref: '#/components/schemas/GetUserResult'
        meta:
          $ref: '#/components/schemas/CommonResponseMeta'
      title: GetUserResponse
    GetUserResult:
      type: object
      required:
        - name
        - mailAddress
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        mailAddress:
          $ref: '#/components/schemas/MailAddress'
      title: GetUserResult
    InternalServerErrorException:
      type: object
      required:
        - errorCode
        - message
        - meta
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
        meta:
          $ref: '#/components/schemas/CommonResponseMeta'
      description: サーバー内部で予期せぬエラーが発生した
      title: InternalServerErrorException
      examples:
        - errorCode: '5000'
          message: InternalServerErrorException
          meta:
            respondedAt: '2025-01-01T12:00:00Z'
    LoginRequest:
      type: object
      required:
        - mailAddress
        - password
      properties:
        mailAddress:
          $ref: '#/components/schemas/MailAddress'
        password:
          $ref: '#/components/schemas/Password'
      title: LoginRequest
    LoginResponse:
      type: object
      required:
        - result
        - meta
      properties:
        result:
          $ref: '#/components/schemas/LoginResult'
        meta:
          $ref: '#/components/schemas/CommonResponseMeta'
      title: LoginResponse
    LoginResult:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          $ref: '#/components/schemas/AccessToken'
        refreshToken:
          $ref: '#/components/schemas/RefreshToken'
      title: LoginResult
    MailAddress:
      type: string
      maxLength: 255
      pattern: ^[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+)*@(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$
      description: メールアドレス (RFC 5322準拠)
      title: MailAddress
      examples:
        - user@example.com
    Password:
      type: string
      minLength: 12
      maxLength: 128
      format: password
      description: パスワード(平文)。入力専用で、レスポンスに含めないこと。
      title: Password
      examples:
        - '************'
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          $ref: '#/components/schemas/RefreshToken'
      title: RefreshRequest
    RefreshResponse:
      type: object
      required:
        - result
        - meta
      properties:
        result:
          $ref: '#/components/schemas/RefreshResult'
        meta:
          $ref: '#/components/schemas/CommonResponseMeta'
      title: RefreshResponse
    RefreshResult:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          $ref: '#/components/schemas/AccessToken'
      title: RefreshResult
    RefreshToken:
      type: string
      minLength: 20
      maxLength: 2048
      format: password
      description: リフレッシュトークン(不透明トークン想定)。アクセストークン再発行に使用する。
      title: RefreshToken
      examples:
        - rt_2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f
    ResourceNotFoundException:
      type: object
      required:
        - errorCode
        - message
        - meta
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
        meta:
          $ref: '#/components/schemas/CommonResponseMeta'
      description: リソースが存在しない
      title: ResourceNotFoundException
      examples:
        - errorCode: '4040'
          message: ResourceNotFoundException
          meta:
            respondedAt: '2025-01-01T12:00:00Z'
    RespondedAt:
      type: string
      format: date-time
      description: レスポンス日時 (RFC 3339 / ISO 8601, PostgreSQL TIMESTAMPTZ互換)
      title: RespondedAt
      examples:
        - '2025-01-01T12:00:00Z'
    UnauthorizedException:
      type: object
      required:
        - errorCode
        - message
        - meta
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
        meta:
          $ref: '#/components/schemas/CommonResponseMeta'
      description: 認証情報が不正
      title: UnauthorizedException
      examples:
        - errorCode: '4010'
          message: UnauthorizedException
          meta:
            respondedAt: '2025-01-01T12:00:00Z'
    UpdateUserRequest:
      type: object
      required:
        - name
        - mailAddress
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        mailAddress:
          $ref: '#/components/schemas/MailAddress'
      title: UpdateUserRequest
    UserId:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: ユーザーID (UUID v7)
      title: UserId
      examples:
        - 018eef15-1234-7123-8123-123456789abc
    UserName:
      type: string
      minLength: 1
      maxLength: 100
      description: ユーザー名
      title: UserName
      examples:
        - 山田太郎
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
